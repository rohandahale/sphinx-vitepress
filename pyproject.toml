[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 license expression
build-backend = "hatchling.build"

[project]
name = "sphinx-vitepress"
version = "0.1.2"
description = "A Sphinx builder that renders your documentation with VitePress."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rohan Dahale", email = "astrorohandahale@gmail.com" }]
requires-python = ">=3.11"
keywords = ["sphinx", "vitepress", "documentation", "builder", "markdown", "autodoc"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Framework :: Sphinx",
  "Framework :: Sphinx :: Extension",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Documentation",
  "Topic :: Documentation :: Sphinx",
  "Topic :: Software Development :: Documentation",
  "Typing :: Typed",
]

dependencies = [
  "sphinx>=7.0",
  "sphinx-markdown-builder>=0.6.10,<0.7",
  # Imported directly by the translator; not relied on transitively.
  "docutils>=0.20",
  # `sphinx-vitepress init` scaffolds a markdown project, so this is
  # required for the documented quickstart to work.
  "myst-parser>=2.0",
]

[project.urls]
Homepage = "https://github.com/rohandahale/sphinx-vitepress"
Documentation = "https://www.rohandahale.com/sphinx-vitepress/"
Repository = "https://github.com/rohandahale/sphinx-vitepress"
Changelog = "https://github.com/rohandahale/sphinx-vitepress/blob/main/CHANGELOG.md"
Issues = "https://github.com/rohandahale/sphinx-vitepress/issues"

[project.scripts]
sphinx-vitepress = "sphinx_vitepress.cli:main"

[project.entry-points."sphinx.builders"]
vitepress = "sphinx_vitepress"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.8",
  "mypy>=1.13",
  "myst-parser>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sphinx_vitepress"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["DocumenterVitepress.jl-0.3.5"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
# No python_version pin: Sphinx 9 uses PEP 695 syntax that a 3.11 grammar
# cannot parse; each CI interpreter checks against the Sphinx it resolves.
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["sphinx_markdown_builder.*", "docutils.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
