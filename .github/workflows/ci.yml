name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# Read-only by default; no job here needs to write to the repository.
permissions:
  contents: read

jobs:
  test:
    name: test py${{ matrix.python }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "${{ matrix.python }}"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -v

  vitepress-smoke:
    name: vitepress build (strict dead links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --locked
      # Skipped tests still exit 0, so a dropped env var would leave this
      # job green while proving nothing. Require a passing count.
      - name: Build the generated site with real VitePress
        env:
          VITEPRESS_SMOKE: "1"
        run: |
          uv run pytest -v -m smoke --strict-markers tests/test_vitepress_smoke.py | tee smoke.log
          grep -qE "[0-9]+ passed" smoke.log || {
            echo "::error::smoke tests did not run" >&2
            exit 1
          }
